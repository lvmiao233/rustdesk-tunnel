[package]
name = "rdt-gui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustdesk-tunnel = { path = "../.." }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
tokio = "1"
toml = "0.8"

[lib]
name = "rdt_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
