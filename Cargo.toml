[package]
name = "rustdesk-tunnel"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
sodiumoxide = "0.2"
russh = "=0.53.0"

[[bin]]
name = "rdt"
path = "src/main.rs"

[workspace]
members = [".", "gui/src-tauri"]

[profile.release]
lto = true
strip = true
