name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    name: cli ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
            archive: tar.gz
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            archive: zip
          - name: macos-universal
            os: macos-latest
            target: ''
            universal: true
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: build (cross)
        if: matrix.cross
        run: |
          cargo install cross --locked
          cross build --release --target ${{ matrix.target }} -p rustdesk-tunnel

      - name: build
        if: ${{ !matrix.cross && !matrix.universal }}
        run: cargo build --release --target ${{ matrix.target }} -p rustdesk-tunnel

      - name: build (macos universal)
        if: matrix.universal
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin -p rustdesk-tunnel
          cargo build --release --target x86_64-apple-darwin -p rustdesk-tunnel
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/rdt \
            target/x86_64-apple-darwin/release/rdt \
            -output target/universal/rdt

      - name: package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          if [ "${{ matrix.universal }}" = "true" ]; then
            cp target/universal/rdt dist/rdt-${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/rdt dist/rdt-${{ matrix.name }}
          fi
          tar -czf dist/rdt-${{ matrix.name }}.tar.gz -C dist rdt-${{ matrix.name }}
        shell: bash

      - name: package (zip)
        if: matrix.archive == 'zip'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rdt.exe dist/rdt-${{ matrix.name }}.exe
          cd dist && 7z a rdt-${{ matrix.name }}.zip rdt-${{ matrix.name }}.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/rdt-${{ matrix.name }}.*

      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" || true
          gh release upload "${{ github.ref_name }}" dist/rdt-${{ matrix.name }}.* --clobber

  gui:
    name: gui ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: '--bundles deb,appimage'
          - name: windows
            os: windows-latest
            args: '--bundles msi,nsis'
          - name: macos-aarch64
            os: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - name: macos-x86_64
            os: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: install linux gui deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: gui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'RustDesk Tunnel ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: collect bundles
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
          if-no-files-found: error
